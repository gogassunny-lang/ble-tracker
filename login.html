<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLE Transaction Tracker — Sign in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fb;--card:#ffffff;--ink:#10203a;--mut:#6b7a90;--soft:#9aa7ba;
    --line:#e6ebf3;--line2:#eef2f8;--blue:#2f6bff;--teal:#0fb6a0;--green:#16b364;--rose:#f24e6e;
    --grad:linear-gradient(135deg,#2f6bff,#0fb6a0);
    --shadow:0 1px 2px rgba(16,32,58,.04),0 8px 24px rgba(16,32,58,.06);
    --shadow-lg:0 12px 40px rgba(16,32,58,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:
    radial-gradient(1100px 600px at 100% -10%,rgba(47,107,255,.10),transparent 60%),
    radial-gradient(900px 500px at -5% 0%,rgba(15,182,160,.10),transparent 55%),
    var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .main{flex:1;display:grid;place-items:center;padding:24px}
  .wrap{width:100%;max-width:430px}
  .brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:24px}
  .logo{width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;
    font-weight:800;color:#fff;font-size:18px;letter-spacing:.5px;box-shadow:0 12px 28px rgba(47,107,255,.32)}
  .brand h1{font-size:24px;font-weight:800;letter-spacing:-.4px}
  .brand p{color:var(--mut);font-size:13px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg)}
  h2{font-size:20px;font-weight:700;margin-bottom:6px}
  .lead{color:var(--mut);font-size:13.5px;margin-bottom:24px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:7px}
  .field{margin-bottom:16px;position:relative}
  input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--ink);transition:.15s}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,107,255,.10)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:10px 0 18px}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer}
  .check input{width:16px;height:16px;accent-color:var(--blue)}
  .link{color:var(--blue);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
  .link:hover{text-decoration:underline}
  .btn{width:100%;background:var(--grad);color:#fff;font-weight:700;padding:13px;border:none;border-radius:12px;
    cursor:pointer;font-size:14.5px;font-family:inherit;box-shadow:0 8px 22px rgba(47,107,255,.28);transition:.18s;letter-spacing:.2px}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px rgba(47,107,255,.36)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none;align-items:flex-start;gap:8px}
  .msg.err{display:flex;background:rgba(242,78,110,.10);color:var(--rose);border:1px solid rgba(242,78,110,.20)}
  .msg.ok{display:flex;background:rgba(22,179,100,.10);color:var(--green);border:1px solid rgba(22,179,100,.20)}
  .msg.info{display:flex;background:rgba(47,107,255,.08);color:var(--blue);border:1px solid rgba(47,107,255,.18)}
  footer{padding:18px;text-align:center;color:var(--soft);font-size:12px}
  footer b{color:var(--mut);font-weight:600}
  .toggle-eye{position:absolute;right:12px;top:34px;color:var(--soft);cursor:pointer;font-size:13px;user-select:none;font-weight:600}
  .toggle-eye:hover{color:var(--blue)}
  .reset-back{font-size:12.5px;color:var(--mut);margin-top:14px;text-align:center;cursor:pointer}
  .reset-back:hover{color:var(--blue)}
</style>
</head>
<body>
<div class="main">
  <div class="wrap">
    <div class="brand">
      <div class="logo">BLE</div>
      <div><h1>BLE Transaction Tracker</h1><p>Secure team workspace</p></div>
    </div>
    <div class="card">
      <div id="signin-view">
        <h2>Welcome back</h2>
        <p class="lead">Sign in to access your dashboard.</p>
        <div class="msg" id="msg"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@company.com"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"><span class="toggle-eye" id="toggle-eye">Show</span></div>
        <div class="row">
          <label class="check"><input type="checkbox" id="remember" checked>Remember me</label>
          <a class="link" id="forgot-link">Forgot password?</a>
        </div>
        <button class="btn" id="signin-btn">Sign in</button>
      </div>
      <div id="reset-view" style="display:none">
        <h2>Reset password</h2>
        <p class="lead">Enter your email — we'll send a reset link.</p>
        <div class="msg" id="rmsg"></div>
        <div class="field"><label for="remail">Email</label><input id="remail" type="email" placeholder="you@company.com"></div>
        <button class="btn" id="reset-btn">Send reset link</button>
        <div class="reset-back" id="reset-back">← Back to sign in</div>
      </div>
    </div>
  </div>
</div>
<footer>Developed by <b>Sunny Gupta</b> &middot; BLE Transaction Tracker &copy; <span id="yr"></span></footer>
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
if(typeof SUPABASE_URL==='undefined'||!SUPABASE_URL){
  document.getElementById('msg').className='msg err';
  document.getElementById('msg').textContent='Configuration missing. Please create config.js with SUPABASE_URL and SUPABASE_ANON_KEY.';
}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

// already signed in? bounce to dashboard
sb.auth.getSession().then(({data})=>{if(data.session)window.location.href='./index.html';});

function showMsg(id,type,text){const el=document.getElementById(id);el.className='msg '+type;el.textContent=text;}
function hideMsg(id){document.getElementById(id).style.display='none';}

document.getElementById('toggle-eye').onclick=()=>{
  const i=document.getElementById('password');const t=document.getElementById('toggle-eye');
  if(i.type==='password'){i.type='text';t.textContent='Hide';}else{i.type='password';t.textContent='Show';}
};

document.getElementById('signin-btn').onclick=async()=>{
  hideMsg('msg');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){showMsg('msg','err','Please enter email and password.');return;}
  const btn=document.getElementById('signin-btn');btn.disabled=true;btn.textContent='Signing in…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    // update last_login
    await sb.from('profiles').update({last_login:new Date().toISOString()}).eq('id',data.user.id);
    showMsg('msg','ok','Signed in. Redirecting…');
    setTimeout(()=>window.location.href='./index.html',400);
  }catch(err){
    let m=err.message||'Sign-in failed.';
    if(/invalid login credentials/i.test(m))m='Email or password is incorrect.';
    showMsg('msg','err',m);btn.disabled=false;btn.textContent='Sign in';
  }
};

document.getElementById('forgot-link').onclick=()=>{
  document.getElementById('signin-view').style.display='none';
  document.getElementById('reset-view').style.display='block';
  hideMsg('rmsg');
  document.getElementById('remail').value=document.getElementById('email').value;
};
document.getElementById('reset-back').onclick=()=>{
  document.getElementById('reset-view').style.display='none';
  document.getElementById('signin-view').style.display='block';
};

document.getElementById('reset-btn').onclick=async()=>{
  hideMsg('rmsg');
  const email=document.getElementById('remail').value.trim();
  if(!email){showMsg('rmsg','err','Please enter your email.');return;}
  const btn=document.getElementById('reset-btn');btn.disabled=true;btn.textContent='Sending…';
  try{
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname.replace(/login\.html$/,'')+'reset.html'});
    if(error)throw error;
    showMsg('rmsg','ok','If an account exists, a reset link has been sent.');
  }catch(err){showMsg('rmsg','err',err.message||'Could not send reset link.');}
  btn.disabled=false;btn.textContent='Send reset link';
};

// Enter key submits
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('signin-btn').click();});
document.getElementById('remail').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('reset-btn').click();});
</script>
</body>
</html>
